# ==========================================
# PRODUCTION PROFILE (application-prod.properties)
# Used on Railway, Render, or any Cloud Server
# Powered entirely by Environment Variables
# ==========================================
server.port=${PORT:8080}

# Cloud Public Domain (e.g. https://your-app.up.railway.app or https://your-app.onrender.com)
app.base-url=${APP_BASE_URL}

# Supabase / Cloud PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool optimization for Supabase Free Tier (prevents connection exhaustion)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Production JPA (No SQL dump for maximum performance & security)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Meta WhatsApp Cloud API (Production Credentials from Env)
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:bakery_bot_secret_token}

# Payment Settings
payment.upi.vpa=${PAYMENT_UPI_VPA:bakery@upi}
payment.upi.name=${PAYMENT_UPI_NAME:Sweet Delights Bakery}
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
